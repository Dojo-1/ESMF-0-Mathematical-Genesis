[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esmf"
version = "0.0.0"
description = "ESMF-0: experimental substrate for endogenous semiotic morphogenesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["esmf"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pyflakes + syntax errors + bugbear. zip(strict=) and unused loop
# variables are style here, not defects.
select = ["F", "E9", "B"]
ignore = ["B905", "B007", "B008"]

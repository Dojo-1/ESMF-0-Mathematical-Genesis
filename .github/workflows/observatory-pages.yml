name: ESMF-0 Living Observatory

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "esmf/glial_quaternion_ag.py"
      - "esmf/compartmental_ah.py"
      - "esmf/telos_substrate_ai.py"
      - "esmf/hypercomplex_tissue_af.py"
      - "research/export_observatory_trace.py"
      - "research/export_g0_ah_microscope.py"
      - "research/export_g0_ai_film.py"
      - "research/g0_ag_development_probe.py"
      - "tests/test_observatory_*.py"
      - "tests/test_g0_ah_microscope.py"
      - "tests/test_g0_ai_film.py"
      - ".github/workflows/observatory-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "esmf/glial_quaternion_ag.py"
      - "esmf/compartmental_ah.py"
      - "esmf/telos_substrate_ai.py"
      - "esmf/hypercomplex_tissue_af.py"
      - "research/export_observatory_trace.py"
      - "research/export_g0_ah_microscope.py"
      - "research/export_g0_ai_film.py"
      - "tests/test_observatory_*.py"
      - "tests/test_g0_ah_microscope.py"
      - "tests/test_g0_ai_film.py"
      - ".github/workflows/observatory-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: esmf-observatory-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Export deterministic genuine G0-AG event states
        run: python -m research.export_observatory_trace --out docs/traces/g0_ag_model.json
      - name: Export source-linked, deliberately selected G0-AH neurite states
        run: python -m research.export_g0_ah_microscope --out docs/traces/g0_ah_microscope.json
      - name: Export observed G0-AI stochastic morphogenesis and its controls
        run: python -m research.export_g0_ai_film --out docs/traces/g0_ai_film.json
      - name: Validate source-linked architecture and recorded event provenance
        run: |
          python -m unittest discover -s tests -p 'test_observatory_*.py' -v
          python -m unittest discover -s tests -p 'test_g0_ah_microscope.py' -v
          python -m unittest discover -s tests -p 'test_g0_ai_film.py' -v
      - name: Syntax-check interactive modules
        run: |
          node --check docs/app.js
          node --check docs/scene.js
          node --check docs/trace-player.js
          node --check docs/neurite.js
          node --check docs/genesis.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact Python generator states with commit provenance
        run: python -m research.export_observatory_trace --out docs/traces/g0_ag_model.json
      - name: Record exact G0-AH branching states with commit provenance
        run: python -m research.export_g0_ah_microscope --out docs/traces/g0_ah_microscope.json
      - name: Record G0-AI role-free stochastic developmental states
        run: python -m research.export_g0_ai_film --out docs/traces/g0_ai_film.json
      - name: Archive replay files without mutating main
        uses: actions/upload-artifact@v4
        with:
          name: esmf-observatory-traces
          path: |
            docs/traces/g0_ag_model.json
            docs/traces/g0_ah_microscope.json
            docs/traces/g0_ai_film.json
          if-no-files-found: error
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload source-linked observatory and recorded trace
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
